# Tier → model mapping (optional override).
#
# Agentum does NOT manage credentials or provider configuration. You install and
# configure the execution runtime (opencode) yourself — its providers, base
# URLs, and API keys live in the runtime's own config. Agentum only maps a tier
# name to the model string it passes via --model.
#
# This file is OPTIONAL. Without it, Agentum uses the built-in defaults that
# ship with the active execution adapter (opencode, free via opencode Zen once
# connected):
#   fast      → opencode/nemotron-3.5-lightning-free
#   strong    → opencode/muse-spark-1.3-contributor-free
#   reasoning → opencode/nemotron-3-ultra-free
#
# Decoding is STRICT: an unknown key or an empty model string fails boot with
# the file named rather than silently falling back to these defaults.
#
# Copy to models.yaml (gitignored) ONLY to override those defaults, and only
# if you mean to replace them: a models.yaml REPLACES the built-in tiers, so a
# copy of this file with every tier commented out is not "use the defaults" —
# it is a configuration with no tiers, and it fails boot with
# "declares no tiers; delete the file …". To go back to the defaults, delete
# the file. AGENTUM_MODELS_CONFIG pointing at a file that does not exist fails
# boot too, rather than quietly searching elsewhere.
#
# Example below: a z.ai / GLM setup using the coding-plan subscription. See
# docs/models.md.
#
# A tier value is either a bare model string (the three below) or a
# {model, variant} mapping (the commented pair): variant is the runtime's
# reasoning-effort setting and reaches the agent's --variant flag, validated
# against the runtime's own per-model variant listing — a value the model does
# not declare fails boot with the vocabulary named. A tier key takes one form
# or the other, never both. Two tiers on one model with different variants are
# how "plan on high, implement on low" is written (stages pick via stage.tier).

# Example: GLM via the z.ai coding plan (swap tiers to taste).
tiers:
  fast: zai-coding-plan/glm-5-turbo
  strong: zai-coding-plan/glm-5.1
  reasoning: zai-coding-plan/glm-5.2
  # focused:
  #   model: zai-coding-plan/glm-5.3
  #   variant: high
  # relaxed:
  #   model: zai-coding-plan/glm-5.3
  #   variant: low

# Default tier when a pack/stage doesn't name one.
default: strong
