api: agentum/v1
pack:
  name: research-first
  version: 0.1.0
  persona: engineering
  description: Investigations where the cause or viable approach is unknown and evidence must be gathered before planning source changes.
memory: {reads: [project], writes: false}
capabilities: [fs.read, fs.write, git.read, git.write, exec.bash]
budgets: {fix_cycles: 2, ask_to_edit: 3}
tiers: {default: strong}
checks: {}
entry: research
approvals:
  - {name: plan, stage: plan, artifact: plan.md, unlocks: source_write}
stages:
  research:
    gate: auto
    role: analyst
    prompt: prompts/research.md
    capabilities: [fs.read, git.read]
    transitions:
      - to: plan
  plan:
    gate: human_approval
    role: analyst
    prompt: prompts/plan.md
    capabilities: [fs.read, git.read]
    transitions:
      - to: implement
  implement:
    gate: auto
    role: implementer
    prompt: prompts/implement.md
    transitions:
      - to: review
  review:
    gate: auto
    role: reviewer
    prompt: prompts/review.md
    capabilities: [fs.read, git.read]
    transitions:
      - {to: fix, condition: 'verdict == "changes_requested"'}
      - {to: done, condition: 'verdict == "approved"'}
  fix:
    gate: auto
    role: fixer
    prompt: prompts/fix.md
    transitions:
      - to: review
  done: {}
