api: agentum/v1
pack:
  name: small-change
  version: 0.1.0
  persona: engineering
  description: Small, well-scoped changes with a clear solution that still need a short approved plan, checks, and review.
memory: {reads: [project], writes: false}
capabilities: [fs.read, fs.write, git.read, git.write, exec.bash]
budgets: {fix_cycles: 2, ask_to_edit: 3}
tiers: {default: strong}
checks: {}
entry: implement
approvals:
  - {name: short_plan, stage: implement, artifact: plan.md, unlocks: source_write, within_stage: true}
stages:
  implement:
    gate: human_approval
    role: implementer
    prompt: prompts/implement.md
    transitions:
      - to: review
  review:
    gate: auto
    role: reviewer
    prompt: prompts/review.md
    capabilities: [fs.read, git.read]
    transitions:
      - {to: fix, condition: 'verdict == "changes_requested"'}
      - {to: done, condition: 'verdict == "approved"'}
  fix:
    gate: auto
    role: fixer
    prompt: prompts/fix.md
    transitions:
      - to: review
  done: {}
